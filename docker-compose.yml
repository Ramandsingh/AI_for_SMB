# Site-scoped stack: backend + database only.
# Nginx is managed at the host level — see deploy/nginx/site.conf.template.

services:
  backend:
    container_name: ai-smb-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      # Loopback-only binding — used for host-level health checks in deploy.sh/CI.
      # nginx-proxy reaches the backend via Docker network (see nginx-proxy-net below),
      # not via this host port.
      - "127.0.0.1:${BACKEND_PORT:-3101}:3002"
    environment:
      - DB_HOST=mysql
      - DB_USER=${DB_USER:-ai_smb_user}
      - DB_PASSWORD=${DB_PASSWORD:-change_me_password}
      - DB_NAME=${DB_NAME:-ai_smb_db}
      - PORT=3002
      - NODE_ENV=production
      - LAN_IP=${LAN_IP:-}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ai-smb-net
      - nginx-proxy-net
    restart: unless-stopped

  mysql:
    container_name: ai-smb-mysql
    image: mysql:8.0
    command: --max_allowed_packet=256M
    expose:
      - "3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_NAME:-ai_smb_db}
      MYSQL_USER: ${DB_USER:-ai_smb_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change_me_password}
    volumes:
      - ai-smb-mysql-data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ai-smb-net
    restart: unless-stopped

networks:
  ai-smb-net:
    driver: bridge
  nginx-proxy-net:
    external: true
    name: nginx-proxy_default

volumes:
  # Renamed from mysql_data → ai-smb-mysql-data to avoid conflicts when multiple
  # sites run on the same host. One-time migration from an existing install:
  #
  #   docker volume create ai-smb-mysql-data
  #   docker run --rm \
  #     -v mysql_data:/from:ro -v ai-smb-mysql-data:/to \
  #     alpine sh -c 'cp -a /from/. /to/'
  #   docker compose up -d
  #
  # After verifying the app works, the old volume can be removed:
  #   docker volume rm mysql_data
  ai-smb-mysql-data:
