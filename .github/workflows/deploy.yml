name: Deploy to MBserver

on:
  push:
    branches:
      - claude/docker-react-vite-mysql-PeMvf
      - main

jobs:
  deploy:
    runs-on: self-hosted
    if: contains(github.event.head_commit.message, '[deploy]')
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Write .env
        run: |
          {
            echo "SITE_ROOT=${{ secrets.SITE_ROOT }}"
            echo "BACKEND_PORT=${{ secrets.BACKEND_PORT }}"
            echo "NGINX_VHOST_DIR='${{ secrets.NGINX_VHOST_DIR }}'"
            echo "NGINX_RELOAD_CMD='${{ secrets.NGINX_RELOAD_CMD }}'"
            echo "DB_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWORD }}"
            echo "DB_USER=${{ secrets.DB_USER }}"
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}"
            echo "DB_NAME=${{ secrets.DB_NAME }}"
            echo "LAN_IP=${{ secrets.LAN_IP }}"
          } > .env

      - name: Build frontend
        run: |
          cd frontend
          npm ci --silent --legacy-peer-deps
          NODE_OPTIONS=--max-old-space-size=3072 npm run build
          cd ..

      - name: Sync static files to site root
        run: |
          # SITE_ROOT comes from the .env written above
          set -a; source .env; set +a
          echo "Syncing to $SITE_ROOT"
          mkdir -p "$SITE_ROOT"
          rsync -a --delete frontend/dist/ "$SITE_ROOT/"
          echo "Sync complete — $(find "$SITE_ROOT" -type f | wc -l | tr -d ' ') files deployed"

      - name: Build and restart backend
        run: |
          # DOCKER_BUILDKIT=0: legacy builder avoids Docker Hub auth on restricted networks
          DOCKER_BUILDKIT=0 docker compose build backend
          docker compose up -d --force-recreate backend
          docker compose up -d mysql

      - name: Install nginx vhost and reload
        run: |
          set -a; source .env; set +a
          # Substitute only site variables; nginx's own $host, $uri etc. are left intact
          envsubst '${SITE_ROOT} ${BACKEND_PORT}' \
            < deploy/nginx/site.conf.template \
            > /tmp/ai-smb.conf
          cp /tmp/ai-smb.conf "${NGINX_VHOST_DIR:-/etc/nginx/conf.d}/ai-smb.conf"
          nginx -t
          eval "${NGINX_RELOAD_CMD:-sudo nginx -s reload}"

      - name: Health check
        run: |
          set -a; source .env; set +a
          echo "--- Container status ---"
          docker compose ps
          echo "--- Backend startup logs ---"
          docker compose logs backend --tail=30
          echo "--- Waiting for backend ---"
          sleep 15
          echo "--- Backend health (direct) ---"
          curl -sf "http://127.0.0.1:${BACKEND_PORT}/api/health" | python3 -m json.tool \
            || { echo "ERROR: Backend health check failed"; docker compose logs backend --tail=50; exit 1; }
          echo "Backend OK"
