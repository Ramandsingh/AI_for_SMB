# Shared nginx server block — all path-based sites on this host.
#
# ONE-TIME SETUP: copy this file to ${NGINX_VHOST_DIR}/00-base.conf
# and create the sites/ subdirectory:
#
#   cp deploy/nginx/base-server.conf "${NGINX_VHOST_DIR}/00-base.conf"
#   mkdir -p "${NGINX_VHOST_DIR}/sites"
#   docker exec nginx-proxy nginx -s reload
#
# After that, each site's deploy drops its own location snippet into
# ${NGINX_VHOST_DIR}/sites/ and reloads nginx — no edits to this file needed.

server {
    listen 80 default_server;
    server_name _;

    # Generous default — covers PDF uploads (55 MB) and image uploads
    client_max_body_size 100m;

    # Each site drops a *.conf snippet here with its own location blocks
    include /etc/nginx/conf.d/sites/*.conf;
}
